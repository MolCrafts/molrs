[package]
name = "molrs"
version = "0.13.2"
edition = "2024"
authors = ["MolCrafts"]
description = "WASM bindings for molrs"
license = "BSD-3-Clause"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
crate-type = ["cdylib", "rlib"]
name = "molwasm"

[workspace]

[features]
# Default build = full (all subsystems). Each forwards to the merged crate's
# matching module feature.
default = ["smiles", "io", "compute", "conformer", "voronoi", "stream"]
smiles  = ["io", "molrs/smiles"]
io      = ["molrs/io"]
# Live-stream wire encoding (MessagePack / JSON). On wasm32 this pulls only
# the codec and `ControlCommand`; `FrameServer` is native-only upstream.
stream  = ["molrs/stream"]
compute = ["molrs/compute"]
conformer = ["molrs/conformer"]
# Radical Voronoi tessellation + its domain/void consumers. Pure Rust, no FFI,
# so it is WASM-clean and ships in the default build.
voronoi = ["compute", "molrs/voronoi"]

[dependencies]
wasm-bindgen = "0.2.123"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# The merged crate (core always on via `zarr`; sub-system modules pulled in by
# the wasm features above) + the FFI handle layer.
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.13.2", default-features = false, features = ["zarr"] }
molrs-ffi = { path = "../molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.13.2", default-features = false }

ndarray = "0.17"
zarrs = { version = "0.23", default-features = false }
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
# Binaryen wasm-opt after wasm-bindgen. -O1: ~19% smaller than rustc-only
# release on Apple M4 (~4s); ABI/smoke-tested locally. Requires `wasm-opt` on PATH
# (e.g. `brew install binaryen`).
wasm-opt = ["-O1"]
