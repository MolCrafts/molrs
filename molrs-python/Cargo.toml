[package]
name = "molrs-python"
version = "0.14.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "Python bindings for molrs molecular simulation library"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
name = "molrs_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = [
    "extension-module",
    "abi3-py312",
    "multiple-pymethods",
] }
numpy = "0.28"
ndarray = "0.17"
serde_json = "1"
# `ff` exposes `molrs_ffi::ForceFieldRef`, the stable handle behind
# `ForceField._ffi_forcefield_capsule()` (the force-field analogue of the frame
# capsule). molrs-python already pulls `molrs/ff` via `full`, so this only turns
# on the matching molrs-ffi handle.
molrs-ffi = { path = "../molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.14.0", features = ["ff"] }
# Base: full (no zarr). Host zarr + path I/O is optional (`fs` feature) so
# Pyodide builds can omit zarrs/libz-sys (emscripten cannot link host zlib).
#
# `net` is unconditional, not a Cargo feature here: molrs declares tokio /
# tungstenite under `cfg(not(target_arch = "wasm32"))` and gates
# `molrs::stream::server` the same way, so a Pyodide (wasm32-emscripten) build
# compiles only the WASM-clean `ControlCommand` wire types and links no
# networking stack. `net` pulls in `stream` (the MessagePack/JSON Frame codec).
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.14.0", default-features = false, features = ["full", "stream"] }

[features]
default = ["fs"]
# Desktop/native: path-based zarr trajectory I/O (`molrs/filesystem` → zarr).
# Off for Pyodide: `maturin … --no-default-features`.
fs = ["molrs/filesystem"]

[workspace]

# Standalone workspace root: does NOT inherit the repo root's [profile.release].
# Keep in sync with ../Cargo.toml so released wheels get the same optimization.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
