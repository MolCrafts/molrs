[project]
site_name = "molrs"
site_description = "Unified documentation for the molrs molecular modeling toolkit."
site_author = "MolCrafts"
site_url = "https://molrs.molcrafts.org/"
repo_url = "https://github.com/MolCrafts/molrs"
repo_name = "MolCrafts/molrs"
docs_dir = "site-src"
site_dir = "site"
copyright = "Copyright &copy; 2026 MolCrafts"

nav = [
  { "Overview" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Rust Quickstart" = "getting-started/quickstart-rust.md" },
    { "Python Quickstart" = "getting-started/quickstart-python.md" },
    { "WASM Quickstart" = "getting-started/quickstart-wasm.md" },
  ] },
  { "Guides" = [
    { "Data Model" = "guides/data-model.md" },
    { "SMILES and Topology" = "guides/smiles-and-topology.md" },
    { "Neighbor Search" = "guides/neighbor-search.md" },
    { "3D Embedding" = "guides/embed-3d.md" },
    { "Force Fields" = "guides/force-field.md" },
    { "I/O Formats" = "guides/io-formats.md" },
    { "Trajectory Analysis" = "guides/trajectory-analysis.md" },
    { "Transport Kernels" = "guides/transport.md" },
  ] },
  { "Reference" = [
    { "Rust" = "reference/rust.md" },
    { "Python" = "reference/python.md" },
    { "WASM" = "reference/wasm.md" },
  ] },
  { "Contributing" = "contributing.md" },
]

# Shared MolCrafts brand theme (bundled with zensical). Palette, color scheme
# toggle, and navigation features are owned by the theme, so they are not
# redeclared here — this keeps molrs visually consistent with the other
# molcrafts.org sites (molpy, molpack, …).
[project.theme]
name = "molcrafts"
language = "en"

# molrs owns its brand colours here. The shared molcrafts theme holds only the
# common palette/layout and reads these two values from config — nothing in
# molcrafts-zensical-theme needs to change to restyle molrs.
[project.extra.molcrafts]
product = "molrs"
accent = "#c2410c"                       # primary (主) — molrs signature colour
accent_soft = "rgba(194, 65, 12, 0.14)"  # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molrs"

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
# Do NOT set paths = ["python"]. Cloudflare Pages / CI run
# `pip install ".[doc]"` first, so the installed wheel (with _lib.abi3.so) lives
# in site-packages. Pointing paths at the bare checkout makes griffe import the
# pure-Python tree without the compiled extension → ModuleNotFoundError: molrs._lib.
# Local: `maturin develop` / `pip install -e ".[doc]"` then `zensical build`.

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true
show_root_full_path = false
show_source = false
# PyO3 classes use ``module = "molrs"``; force runtime inspection so griffe
# resolves extension types and re-exports (Frame/Block wrappers, compute.*).
force_inspection = true
