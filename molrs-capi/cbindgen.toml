language = "C"
include_guard = "MOLRS_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify. */"
tab_width = 4
style = "both"
cpp_compat = true
documentation = false

# (No [defines]: the numeric-width cargo features were removed long ago —
# widths are fixed, F is double unconditionally — so there is nothing for
# cbindgen to map onto a C macro; the old mapping died with the dead CMake
# switch of the same name.)

[export]
prefix = ""
exclude = ["CStore", "BoxKey", "FFKey"]

[export.rename]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
rename_args = "None"

[parse]
parse_deps = false
