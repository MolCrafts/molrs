[package]
name = "molcrafts-molrs-capi"
version = "0.14.0"
edition = "2024"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "C API for molrs, enabling C/C++ integration"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
name = "molrs_capi"
crate-type = ["cdylib", "staticlib", "lib"]

[workspace]

# Standalone workspace root: does NOT inherit the repo root's [profile.release].
# Keep the four keys identical to ../Cargo.toml so every root ships the same
# optimisation.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[features]
default = []

[dependencies]
# The merged crate on its defaults, plus the explicit ff + io + smiles modules
# this C API exposes (additive; documents what the crate actually needs).
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.14.0", features = ["ff", "io", "smiles"] }
molrs-ffi = { path = "../molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.14.0" }
slotmap = "1.0"
ndarray = "0.17"
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"
