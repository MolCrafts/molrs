[package]
name = "molcrafts-molrs-capi"
version = "0.14.0"
edition = "2024"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "C API for molrs, enabling C/C++ integration"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
name = "molrs_capi"
crate-type = ["cdylib", "staticlib", "lib"]

[workspace]

# Standalone workspace root: does NOT inherit the repo root's [profile.release].
# Keep in sync with ../Cargo.toml so released C libs get the same optimization.
#
# No LTO here — it is incompatible with the shared dylib graph: once a Rust
# dylib (libmolrs_ffi) is in a cdylib's dependency graph, rustc refuses with
# "only 'staticlib', 'bin', and 'cdylib' outputs are supported with LTO"
# (probe C2 in .claude/specs/ffi-shared-dylib.md). CI/publish restore it on
# their static path via env CARGO_PROFILE_RELEASE_LTO=thin.
[profile.release]
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
default = []

[dependencies]
# The merged crate on its default feature union (the shared-dylib precondition),
# plus the explicit ff + io + smiles modules this C API exposes. The explicit
# list is additive and idempotent with the union — it documents what this crate
# actually needs, and would still hold if the union ever shrank.
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.14.0", features = ["ff", "io", "smiles"] }
molrs-ffi = { path = "../molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.14.0" }
slotmap = "1.0"
ndarray = "0.17"
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"
