# prek. Every gate is a `scripts/check.sh <gate>` call, the same call the CI
# workflows make, on the toolchain rust-toolchain.toml pins for both. Change a
# gate in check.sh, never here or in a workflow.
#
# Three tiers, cheapest first:
#   pre-commit  fmt + clippy of molcrafts-molrs: one incremental build, seconds.
#   pre-push    doc + test, plus only the binder gates whose files changed.
#               Each binder links molrs under its own feature set / target,
#               i.e. one more full compile, so none runs at commit time
#               (operator ruling 2026-09-25).
#   CI only     `features` (16 extra feature-set compiles) and `package`.
#               They rarely break and cost the most; run them by hand with
#               `scripts/check.sh features package` when touching Cargo
#               features or the crate's file list.
#
# Hooks are scoped with `files:` so a change confined to one binder does not
# build the other four. `molrs/` and the root build config are in every scope,
# because every binder links molrs. Full CI parity is `scripts/check.sh all`.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: fmt
        name: check fmt
        entry: scripts/check.sh fmt
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: clippy
        name: check clippy (molcrafts-molrs)
        entry: scripts/check.sh clippy
        language: system
        pass_filenames: false
        files: &core ^(molrs/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-commit]

      - id: core
        name: check doc test (molcrafts-molrs)
        entry: scripts/check.sh doc test
        language: system
        pass_filenames: false
        files: *core
        stages: [pre-push]

      - id: ffi
        name: check ffi
        entry: scripts/check.sh ffi
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: cxx
        name: check cxx
        entry: scripts/check.sh cxx
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-cxxapi/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: python
        name: check python
        entry: scripts/check.sh python
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-python/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: capi
        name: check capi
        entry: scripts/check.sh capi
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-capi/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: wasm
        name: check wasm
        entry: scripts/check.sh wasm
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-wasm/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      # Local housekeeping, not a gate. target/ is a cache, and a bloated one is
      # slower than none: at 101 GB a one-file rebuild cost 44-79 s where a
      # clean tree costs 6-7 s. cargo-sweep only touches artifacts nothing has
      # read for two weeks.
      - id: target-sweep
        name: prune target/ past 20 GB
        entry: >-
          bash -c 'set -euo pipefail;
          [ -d target ] || exit 0;
          size=$(du -sx --block-size=1G target/ | cut -f1);
          if [ "$size" -ge 20 ]; then
          echo "target/ is ${size}G - sweeping artifacts unread for 14 days";
          cargo sweep -t 14;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
