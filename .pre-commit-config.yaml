# Mirrors every check in .github/workflows/ci-*.yml. Any divergence is a
# bug — when you add/modify a CI step, update this file in the same commit.
#
# Stages:
#   pre-commit (default): fast checks (fmt, clippy). Runs on every commit.
#   pre-push:            slow checks (full workspace test, wasm build,
#                        python build+test, C API cmake+ctest). Runs before
#                        push only.
#
# Install both stages:
#   pre-commit install --hook-type pre-commit --hook-type pre-push

repos:
  - repo: local
    hooks:
      # ─── ci-rust.yml::fmt ─────────────────────────────────────────────────
      - id: cargo-fmt
        name: cargo fmt --check (workspace)
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-fmt-python
        name: cargo fmt --check (molrs-python)
        entry: bash -c 'cd molrs-python && cargo fmt -- --check'
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-fmt-wasm
        name: cargo fmt --check (molrs-wasm)
        entry: bash -c 'cd molrs-wasm && cargo fmt -- --check'
        language: system
        pass_filenames: false
        types: [rust]

      # ─── ci-rust.yml::clippy ──────────────────────────────────────────────
      # CI runs (verbatim — no --locked):
      #   cargo clippy --workspace --all-targets -- -D warnings
      #   cargo clippy -p molcrafts-molrs --all-targets --features full -- -D warnings
      - id: cargo-clippy-workspace
        name: cargo clippy --workspace --all-targets (-D warnings)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy-facade-full
        name: cargo clippy facade --features full (-D warnings)
        entry: cargo clippy -p molcrafts-molrs --all-targets --features full -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy-python
        name: cargo clippy (molrs-python)
        entry: bash -c 'cd molrs-python && cargo clippy -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy-wasm
        name: cargo clippy (molrs-wasm)
        entry: bash -c 'cd molrs-wasm && cargo clippy -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]

      # ─── ci-rust.yml::test (Fetch test data) ──────────────────────────────
      # CI's test job clones MolCrafts/tests-data before running --tests. The
      # pre-push gate must too, or the data-dependent integration tests below
      # would pass locally (skipped/absent) while failing in CI. The script is
      # fetch-once (reuses an existing clone), so this is a no-op once cloned.
      # always_run: the data is needed regardless of which files a push touches.
      - id: fetch-test-data
        name: fetch tests-data (MolCrafts/tests-data)
        entry: bash scripts/fetch-test-data.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ─── ci-rust.yml::test (Test (workspace) + (all sub-systems)) ─────────
      # Byte-for-byte the two CI test invocations (no --locked: deps resolve from
      # Cargo.toml each run, exactly as CI does). --tests --examples are REQUIRED
      # for parity: the integration tests under molrs/tests/ (io, compute, …) run
      # here exactly as CI runs them.
      - id: cargo-test-workspace
        name: cargo test --workspace --lib --tests --examples
        entry: cargo test --workspace --lib --tests --examples
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]

      - id: cargo-test-facade-full
        name: cargo test facade --lib --tests --examples --features "full filesystem"
        entry: cargo test -p molcrafts-molrs --lib --tests --examples --features "full filesystem"
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]

      # ─── ci-rust.yml::test (Benches build) ────────────────────────────────
      - id: cargo-bench-build
        name: cargo bench --no-run --features full
        entry: cargo bench -p molcrafts-molrs --no-run --features full
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]

      # ─── ci-wasm.yml ──────────────────────────────────────────────────────
      - id: wasm-pack-build
        name: wasm-pack build (molrs-wasm)
        entry: bash -c 'cd molrs-wasm && wasm-pack build --target web'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]

      # ─── ci-capi.yml ──────────────────────────────────────────────────────
      - id: capi-cargo-build
        name: cargo build (molrs-capi, generates header via cbindgen)
        entry: cargo build --manifest-path molrs-capi/Cargo.toml
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]

      - id: capi-cmake-test
        name: cmake build + ctest (molrs-capi C++ integration)
        entry: bash -c 'cd molrs-capi && cmake -S tests/cpp -B build-test && cmake --build build-test && ctest --test-dir build-test --output-on-failure'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]

      # ─── ci-python.yml (Build wheel → Install → Test) ─────────────────────
      # Mirrors the whole ci-python job as one atomic gate: build the wheel,
      # install it, run pytest -q (needs tests-data, fetched above). CI runs the
      # 3.12 / 3.13 matrix; locally we pin to the active python3 — the matrix is
      # the CI runner's job. `rm -rf target/wheels` first so the install glob
      # only ever sees the wheel we just built (stale version-bump wheels left in
      # target/wheels make pip report "conflicting dependencies" and refuse).
      # types_or [python, rust]: rebuild + retest when either the extension (.rs)
      # or the Python package/tests (.py) change, matching CI's unconditional run.
      - id: python-build-and-test
        name: maturin build + pytest (molrs-python)
        entry: bash -c 'cd molrs-python && rm -rf target/wheels && maturin build --release && python -m pip install --quiet --force-reinstall target/wheels/*.whl && pytest -q'
        language: system
        pass_filenames: false
        types_or: [python, rust]
        stages: [pre-push]
