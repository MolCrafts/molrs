# prek: pre-commit = rustfmt + clippy + rustdoc; pre-push = unit + python + wasm
# + capi. Mirrors ci.yml (rust / wasm / python / capi). No wrapper scripts.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: >-
          bash -c 'set -euo pipefail;
          cargo fmt --all --check;
          for crate in molrs-ffi molrs-python molrs-wasm molrs-capi molrs-cxxapi; do
          cargo fmt --manifest-path "$crate/Cargo.toml" --check;
          done'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-clippy
        name: clippy
        entry: >-
          sh -c 'cargo clippy -p molcrafts-molrs --all-targets --features full,filesystem,stream -- -D warnings
          && cargo clippy --manifest-path molrs-cxxapi/Cargo.toml --all-targets -- -D warnings
          && cargo clippy --manifest-path molrs-python/Cargo.toml --all-targets -- -D warnings
          && cargo clippy --manifest-path molrs-capi/Cargo.toml --all-targets -- -D warnings
          && cargo clippy --manifest-path molrs-wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          && RUSTDOCFLAGS="-D warnings" cargo doc -p molcrafts-molrs --no-deps --features full,filesystem,stream'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-test-unit
        name: Rust tests (core + FFI + CXX)
        entry: >-
          sh -c 'bash scripts/fetch-test-data.sh
          && cargo test -p molcrafts-molrs --lib --features full,filesystem,stream
          && cargo test --doc -p molcrafts-molrs --features full,filesystem,stream
          && cargo test --manifest-path molrs-ffi/Cargo.toml
          && cargo test --manifest-path molrs-cxxapi/Cargo.toml'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: python-tox
        name: tox -e py
        entry: >-
          sh -c 'uv --directory molrs-python sync --no-install-project --extra dev
          && uv --directory molrs-python run --no-sync tox -e py'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: wasm-pack
        name: wasm-pack build
        entry: >
          bash -c 'set -euo pipefail;
          command -v wasm-pack >/dev/null || cargo install wasm-pack;
          command -v wasm-opt >/dev/null || {
            echo "wasm-opt not found (needed for molrs-wasm release). Install: brew install binaryen" >&2;
            exit 1;
          };
          rustup target add wasm32-unknown-unknown 2>/dev/null || true;
          cd molrs-wasm;
          wasm-pack build --release --target bundler --scope molcrafts --out-name molrs'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The `;` after every line are load-bearing, not style: `>-` folds this
      # block onto ONE line, so without them the whole thing became a single
      # `set -euo pipefail cargo build … ctest …` command — `set` with a pile of
      # positional arguments, which compiles nothing, runs no ctest, and exits 0
      # unconditionally. This gate could not fail from the day it was written
      # until 2026-08-23. Reproduce the old shape with:
      #   sh -c 'set -euo pipefail echo NOPE false'; echo $?   # -> 0, no NOPE
      - id: capi-tests
        name: C API ctest
        entry: >-
          bash -c 'set -euo pipefail;
          cargo build --manifest-path molrs-capi/Cargo.toml;
          cmake -S molrs-capi/tests/cpp -B molrs-capi/build-test;
          cmake --build molrs-capi/build-test;
          ctest --test-dir molrs-capi/build-test --output-on-failure'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
