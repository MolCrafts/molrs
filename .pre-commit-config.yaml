# CI / pre-commit parity — gates that can fail the default CI workflow.
#
# Maps to remote workflows:
#   CI  (ci.yml → ci-rust / ci-wasm / ci-python / ci-capi)
#   Docs (Cloudflare Pages: pip install ".[doc]" && zensical build)
#
# Out of band (not local gates, not required CI):
#   Full / integration binaries under molrs/tests/  — not a CI gate
#   Bench, Publish, Nightly
#
# Install:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Fast lint on every commit; binder + docs on pre-push.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # ── CI Rust: fmt / clippy / unit ───────────────────────────────────
      - id: cargo-fmt
        name: "CI Rust / rustfmt"
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: cargo-clippy
        name: "CI Rust / clippy"
        entry: >-
          bash -c 'cargo clippy -p molcrafts-molrs --all-targets --features full -- -D warnings
          && cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: cargo-test-unit
        name: "CI Rust / unit (--lib)"
        entry: cargo test -p molcrafts-molrs --lib --features full
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # ── CI Python ───────────────────────────────────────────────────────
      - id: python-package
        name: "CI Python / maturin build + pytest"
        entry: >-
          bash -c 'set -euo pipefail
          cd molrs-python
          python -m pip install -q maturin pytest numpy
          maturin build --release
          python -m pip install -q target/wheels/*.whl --force-reinstall
          pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # ── CI WASM ─────────────────────────────────────────────────────────
      - id: wasm-pack
        name: "CI WASM / wasm-pack build"
        entry: >-
          bash -c 'set -euo pipefail
          command -v wasm-pack >/dev/null || cargo install wasm-pack
          rustup target add wasm32-unknown-unknown 2>/dev/null || true
          cd molrs-wasm
          wasm-pack build --release --target bundler --scope molcrafts --out-name molrs'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # ── CI C API ────────────────────────────────────────────────────────
      - id: capi-tests
        name: "CI C API / cmake + ctest"
        entry: >-
          bash -c 'set -euo pipefail
          cargo build --manifest-path molrs-capi/Cargo.toml
          cmake -S molrs-capi/tests/cpp -B molrs-capi/build-test
          cmake --build molrs-capi/build-test
          ctest --test-dir molrs-capi/build-test --output-on-failure'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # ── Docs (Cloudflare Pages equivalent) ──────────────────────────────
      - id: docs-zensical
        name: "Docs / zensical build (Pages parity)"
        entry: >-
          bash -c 'set -euo pipefail
          cd molrs-python
          python -m pip install -q -e ".[doc]"
          zensical build'
        language: system
        pass_filenames: false
        stages: [pre-push]
