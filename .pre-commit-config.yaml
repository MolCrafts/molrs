# prek / pre-commit. Every gate is a `scripts/check.sh <gate>` call, the same
# call the CI workflows make, on the toolchain rust-toolchain.toml pins for
# both. Change a gate in check.sh, never here or in a workflow.
#
# Three tiers, cheapest first:
#   pre-commit  file hygiene, `fmt`, and the std::os cfg guard: nothing
#               compiles, so a commit never waits for a build (or for Slurm).
#   pre-push    the hygiene hooks on --all-files, `partners`, clippy + doc +
#               test, the binder gates whose files changed, `mrec` (molrec's
#               conformance suite at the commit .github/partners.env pins,
#               as ci-snapshot.yml runs it) and `docs` (the site as Cloudflare
#               Pages builds it). Each binder links molrs under its own
#               feature set / target, i.e. one more full compile, so none runs
#               at commit time (operator ruling 2026-09-25).
#   CI only     `features` (16 extra feature-set compiles) and `package`.
#               They rarely break and cost the most; run them by hand with
#               `scripts/check.sh features package` when touching Cargo
#               features or the crate's file list.
#
# Hooks are scoped with `files:` so a change confined to one binder does not
# build the other four. `molrs/` and the root build config are in every scope,
# because every binder links molrs. Full CI parity is `scripts/check.sh all`.
#
# check.sh dispatches every gate but `fmt`/`partners` to $MOLCRAFTS_HOOK_RUNNER
# when that is set (a compute node on the MolCrafts cluster); see "Hooks" in
# molrs-python/docs/contributing.md. Never --no-verify.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: fmt
        name: check fmt
        entry: scripts/check.sh fmt
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # A bare std::os::unix / std::os::windows path is a hard compile error on
      # the other OS, and only CI's windows/macos legs build there. Gate it:
      # put any `#[cfg(...)]` attribute on the line directly above (or on the
      # same line). Escape hatch, for a use inside an item already gated
      # further up: end the line with `// os-gated: <why>`. A hit is reported
      # from the line above the offending one (the match spans both).
      - id: os-cfg
        name: "std::os::unix / std::os::windows only under #[cfg]"
        language: pygrep
        entry: '^(?![^\n]*#\[cfg)[^\n]*\n(?![^\n]*(?:#\[cfg|os-gated))(?![ \t]*//)[^\n]*\bstd::os::(?:unix|windows)\b'
        args: [--multiline]
        types: [rust]

      # A commit checks its staged files only. Re-run the commit-time hooks
      # above over the whole tree, so an untouched file cannot carry a defect
      # (a missing final newline, a bare std::os path) into CI.
      - id: all-files
        name: commit hooks on --all-files
        entry: uvx pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: partners
        name: check partners (pins exist; path deps resolve in CI)
        entry: scripts/check.sh partners
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: core
        name: check clippy doc test (molcrafts-molrs)
        entry: scripts/check.sh clippy doc test
        language: system
        pass_filenames: false
        files: &core ^(molrs/|Cargo\.(toml|lock)|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: ffi
        name: check ffi
        entry: scripts/check.sh ffi
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: cxx
        name: check cxx
        entry: scripts/check.sh cxx
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-cxxapi/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: python
        name: check python
        entry: scripts/check.sh python
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-python/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        exclude: ^molrs-python/docs/
        stages: [pre-push]

      - id: capi
        name: check capi
        entry: scripts/check.sh capi
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-capi/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      - id: wasm
        name: check wasm
        entry: scripts/check.sh wasm
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-wasm/|Cargo\.toml|\.cargo/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      # molrec's conformance suite through molrs.io.mrec, against the molrec
      # commit .github/partners.env pins (ci-snapshot.yml's mrec step).
      - id: mrec
        name: check mrec (molrec conformance at the pinned commit)
        entry: scripts/check.sh mrec
        language: system
        pass_filenames: false
        files: ^(molrs/|molrs-ffi/|molrs-python/|Cargo\.(toml|lock)|\.cargo/|rust-toolchain\.toml|scripts/(check\.sh|ci-conformance\.py|partners\.py)|\.github/(partners\.env|workflows/ci-snapshot\.yml))
        exclude: ^molrs-python/docs/
        stages: [pre-push]

      # The docs site, built as Cloudflare Pages builds it, --strict. The
      # pages, zensical.toml and the Python API (the stub, the PyO3 sources the
      # reference introspects) all live under molrs-python/.
      - id: docs
        name: check docs (zensical --strict, as Cloudflare Pages)
        entry: scripts/check.sh docs
        language: system
        pass_filenames: false
        files: ^(molrs-python/|rust-toolchain\.toml|scripts/check\.sh)
        stages: [pre-push]

      # Local housekeeping, not a gate. target/ is a cache, and a bloated one is
      # slower than none: at 101 GB a one-file rebuild cost 44-79 s where a
      # clean tree costs 6-7 s. cargo-sweep only touches artifacts nothing has
      # read for two weeks.
      - id: target-sweep
        name: prune target/ past 20 GB
        entry: >-
          bash -c 'set -euo pipefail;
          [ -d target ] || exit 0;
          size=$(du -sx --block-size=1G target/ | cut -f1);
          if [ "$size" -ge 20 ]; then
          echo "target/ is ${size}G - sweeping artifacts unread for 14 days";
          cargo sweep -t 14;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
