# Local gates mirror the **default** CI only (ci-rust unit + fmt/clippy).
# Full integration/e2e is `.github/workflows/full.yml` — never pre-push.
#
# Install:
#   pre-commit install --hook-type pre-commit --hook-type pre-push

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit, pre-push]

      - id: cargo-clippy
        name: cargo clippy (full + cxxapi, -D warnings)
        entry: bash -c 'cargo clippy -p molcrafts-molrs --all-targets --features full -- -D warnings && cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit, pre-push]

      - id: cargo-test-unit
        name: cargo test --lib --features full
        entry: cargo test -p molcrafts-molrs --lib --features full
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit, pre-push]
