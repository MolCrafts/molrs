# Managed by prek (drop-in pre-commit): `prek install`
# Mirrors default CI (ci.yml → rust / wasm / python / capi).
#   commit  — rustfmt + clippy
#   pre-push — unit tests + tox python + wasm-pack + C API ctest
#
# No project scripts/ wrappers for gates.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # ── CI Rust (ci-rust.yml) ───────────────────────────────────────────
      # always_run: CI rustfmt/clippy are whole-tree gates. Without this, prek
      # skips them when the staged set has no "matching" files (or only
      # non-Rust paths), which is exactly how rustfmt/clippy failures reached
      # GitHub Actions on direct pushes to dev.
      - id: cargo-fmt
        name: "CI Rust / rustfmt"
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: cargo-clippy
        name: "CI Rust / clippy"
        entry: >-
          sh -c 'cargo clippy -p molcrafts-molrs --all-targets --features full,filesystem -- -D warnings
          && cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: cargo-test-unit
        name: "CI Rust / unit (--lib)"
        # Fetch MolCrafts/tests-data first — same order as ci-rust.yml unit job.
        # Several --lib tests resolve fixtures under ../tests-data/<format>/.
        entry: >-
          sh -c 'bash scripts/fetch-test-data.sh
          && cargo test -p molcrafts-molrs --lib --features full,filesystem'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── CI Python (ci-python.yml) via tox ────────────────────────────────
      - id: python-tox
        name: "CI Python / tox -c molrs-python -e py"
        # Gate tools only (no maturin project install) — matches ci-python.yml.
        # Installing the project here would PEP517-build the extension once,
        # then tox builds it again with maturin build --release.
        entry: >-
          sh -c 'uv --directory molrs-python sync --no-install-project --extra dev
          && uv --directory molrs-python run --no-sync tox -e py'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── CI WASM (ci-wasm.yml) ───────────────────────────────────────────
      - id: wasm-pack
        name: "CI WASM / wasm-pack build"
        entry: >
          sh -c 'set -euo pipefail;
          if ! command -v wasm-pack >/dev/null; then
            echo "wasm-pack not on PATH (CI uses taiki-e/install-action binary); falling back to cargo install";
            cargo install wasm-pack;
          fi;
          rustup target add wasm32-unknown-unknown 2>/dev/null || true;
          cd molrs-wasm;
          wasm-pack build --release --target bundler --scope molcrafts --out-name molrs'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── CI C API (ci-capi.yml) ──────────────────────────────────────────
      - id: capi-tests
        name: "CI C API / cmake + ctest"
        entry: >-
          sh -c 'set -euo pipefail
          cargo build --manifest-path molrs-capi/Cargo.toml
          cmake -S molrs-capi/tests/cpp -B molrs-capi/build-test
          cmake --build molrs-capi/build-test
          ctest --test-dir molrs-capi/build-test --output-on-failure'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
