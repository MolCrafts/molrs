# prek: pre-commit = rustfmt+clippy; pre-push = unit + python + wasm + capi
# Mirrors ci.yml (rust / wasm / python / capi). No wrapper scripts.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-clippy
        name: clippy
        entry: >-
          sh -c 'cargo clippy -p molcrafts-molrs --all-targets --features full,filesystem -- -D warnings
          && cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-test-unit
        name: cargo test --lib
        entry: >-
          sh -c 'bash scripts/fetch-test-data.sh
          && cargo test -p molcrafts-molrs --lib --features full,filesystem'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: python-tox
        name: tox -e py
        entry: >-
          sh -c 'uv --directory molrs-python sync --no-install-project --extra dev
          && uv --directory molrs-python run --no-sync tox -e py'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: wasm-pack
        name: wasm-pack build
        entry: >
          sh -c 'set -euo pipefail;
          command -v wasm-pack >/dev/null || cargo install wasm-pack;
          rustup target add wasm32-unknown-unknown 2>/dev/null || true;
          cd molrs-wasm;
          wasm-pack build --release --target bundler --scope molcrafts --out-name molrs'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: capi-tests
        name: C API ctest
        entry: >-
          sh -c 'set -euo pipefail
          cargo build --manifest-path molrs-capi/Cargo.toml
          cmake -S molrs-capi/tests/cpp -B molrs-capi/build-test
          cmake --build molrs-capi/build-test
          ctest --test-dir molrs-capi/build-test --output-on-failure'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
