[workspace]
members = ["molrs"]
# Every binder crate — molrs-ffi, molrs-python, molrs-capi, molrs-wasm and
# molrs-cxxapi — is a standalone workspace root with its own `[workspace]`.
# Address them by `--manifest-path <dir>/Cargo.toml`, never `-p`.
exclude = ["molrs-ffi"]
resolver = "3"

[workspace.package]
# Keep standalone binding manifests and Python metadata on this version.
# Downstream consumers pin the major.minor ABI line; release history is in tags.
version = "0.14.0"
edition = "2024"
rust-version = "1.91"
license = "BSD-3-Clause"
authors = ["MolCrafts"]
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

# Every binder root repeats these four keys verbatim (a standalone workspace
# does not inherit them), so released wheels, C libs and the crate build alike.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
