[workspace]
members = [
    "molrs",
    "molrs-cxxapi",
]
# molrs-ffi declares its own `[workspace]` (it is a standalone crate shared by
# molrs-python and molrs-cxxapi). It is a path dependency of molrs-cxxapi but
# must not be folded into this workspace — exclude it so cargo treats it as a
# separate workspace root.
exclude = ["molrs-ffi"]
resolver = "3"

[workspace.package]
# BREAKING (0.6.0): freud-style `compute` reorganization into per-category
# folders (transport / spectroscopy / shape / ml / dynamics / dielectric) —
# crate-root re-exports of every relocated type are preserved, only
# fully-qualified `compute::<old_submodule>::` paths change. Removed the native
# GAFF/AMBER parameter estimator (`ParameterEstimator`, the `estimate` module,
# and its `gaff_*.json` data) — parameter estimation for uncovered bonded terms
# is delegated to embedded reference; the FF-agnostic `Estimator`/`assign_bonded_with`
# seam is kept. molrs / molcrafts-molrs / PyPI / molpy share one version line;
# downstream exact-pins update to 0.8.2. Release notes live in git log / tags.
version = "0.8.2"
edition = "2024"
rust-version = "1.91"
license = "BSD-3-Clause"
authors = ["MolCrafts"]
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

# The merged crate. Binders (molrs-cxxapi here, plus the excluded molrs-ffi /
# molrs-wasm / molrs-python) depend on it directly with the features they need.
[workspace.dependencies]
molcrafts-molrs = { path = "molrs", version = "0.8.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
