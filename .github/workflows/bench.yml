name: Bench

# Runs the criterion regression benchmarks — core (Frame, graph/topology,
# region, neighbors) plus compute (rdf/msd/shape/transport/spectroscopy/…) —
# and tracks them over time. Criterion's `--output-format bencher` emits the
# libtest `bench: N ns/iter` lines that github-action-benchmark's `cargo` tool
# parses. The compute suite needs the `full` feature (its category kernels live
# behind `compute` + `voronoi`; `full` avoids the openblas requirement of the
# separate `blas` feature).
#
# Criterion is never on the default PR path (ci-rust is unit-only).
#
# Release-only cadence: at ~400s this was by far the largest cost on every
# master push — more than twice the whole CI fan-out (rust + wasm + python +
# capi, ~150s). Criterion on shared runners also carries enough variance that
# per-commit points tracked runner noise as much as molrs. One point per
# release is a cleaner signal; dispatch it by hand when a change is expected
# to move performance.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # push results to the gh-pages dashboard
  deployments: write   # github-action-benchmark uses deployment status

# CI/publish pin today's static, LTO'd form; the local default is dynamic via
# .cargo/config.toml (env RUSTFLAGS replaces those rustflags entirely). Bench
# MUST stay static: a shared dylib has no cross-crate inlining, so a dynamic
# run would break comparability with the whole recorded history.
env:
  RUSTFLAGS: "-C prefer-dynamic=no"
  CARGO_PROFILE_RELEASE_LTO: "thin"

jobs:
  bench:
    name: criterion regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Run core benchmarks (bencher output)
        run: |
          cargo bench -p molcrafts-molrs --bench core_benchmarks -- \
            --output-format bencher | tee output.txt

      - name: Run compute benchmarks (bencher output)
        run: |
          cargo bench -p molcrafts-molrs --bench compute_benchmarks --features full -- \
            --output-format bencher | tee -a output.txt

      - name: Upload raw bench output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-bench-${{ github.run_id }}
          path: output.txt
          if-no-files-found: error

      - name: Publish benchmark history
        if: github.repository == 'MolCrafts/molrs' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Criterion on shared runners is noisy — alert loudly, do not fail.
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
