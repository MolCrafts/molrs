name: Publish

# Tag on master → crates.io + npm + PyPI (desktop + Pyodide wheels).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# CI/publish pin today's static, LTO'd form; the local default is dynamic via
# .cargo/config.toml (env RUSTFLAGS replaces those rustflags entirely).
env:
  RUSTFLAGS: "-C prefer-dynamic=no"
  CARGO_PROFILE_RELEASE_LTO: "thin"

jobs:
  guard:
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on master
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag is not on master"
            exit 1
          fi

  publish-molrs:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish molcrafts-molrs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path molrs/Cargo.toml \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          # crates.io rejects bare curl without a User-Agent (empty body / 403).
          if curl -sfL -A "molrs-publish/1.0" \
              "https://crates.io/api/v1/crates/molcrafts-molrs/$VERSION" >/dev/null; then
            echo "✓ molcrafts-molrs@$VERSION already on crates.io"
            exit 0
          fi
          set +e
          OUT=$(cargo publish --manifest-path molrs/Cargo.toml 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" -eq 0 ]; then
            exit 0
          fi
          # Index lag / race after a successful prior publish.
          if printf '%s\n' "$OUT" | grep -qiE 'already exists|already uploaded'; then
            echo "✓ already on crates.io (cargo message)"
            exit 0
          fi
          exit "$CODE"

  publish-wasm:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-wasm
          # Single entry: the committed .cargo/config.toml routes molrs-wasm's
          # build into <repo>/target too.
          workspaces: ". -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # molrs-wasm release profile runs wasm-opt -O1 (see Cargo.toml metadata).
      # apt binaryen is too old for current rustc wasm; pin a GitHub release.
      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          VER=version_123
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-opt --version
      - working-directory: molrs-wasm
        run: wasm-pack build --release --target bundler --scope molcrafts --out-name molrs
      - working-directory: molrs-wasm/pkg
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "✓ $NAME@$VERSION already on npm"
          else
            npm publish --access public --provenance
          fi

  # Desktop abi3 wheels (one interpreter is enough). macOS / Linux ARM are
  # separate targets (universal2 fat wheels were rejected by PyPI).
  build-python:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ""
            artifact: linux-x64
          - os: ubuntu-latest
            # Cross-compile manylinux aarch64 (Graviton / arm64 servers).
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: windows-latest
            target: ""
            artifact: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-py-${{ matrix.artifact }}
          workspaces: ". -> target"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: molrs-python
          target: ${{ matrix.target }}
          manylinux: auto
          command: build
          # default features include `fs` (host filesystem zarr I/O)
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.artifact }}
          path: molrs-python/dist

  # Pyodide / Emscripten wheel for micropip (browser)
  build-python-pyodide:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-py-pyodide
          workspaces: ". -> target"
      - name: Build Pyodide wheel
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_PLATFORM: pyodide
          # Package requires-python >=3.14 → build for current Pyodide CPython 3.14.
          # (0.27.x / emscripten 3.1.58 was for 3.12; MolVis plugin upgrade later.)
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_TEST_SKIP: "*"
          # No host FS / zarr (libz-sys) on Emscripten.
          CIBW_ENVIRONMENT_PYODIDE: MATURIN_PEP517_ARGS=--no-default-features
          # Host rustc/cargo must stay visible to maturin under pyodide-build.
          CIBW_XBUILD_TOOLS: rustc cargo rustup
          CIBW_BEFORE_BUILD_PYODIDE: rustup target add wasm32-unknown-emscripten
        with:
          package-dir: molrs-python
          output-dir: molrs-python/dist-pyodide
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: molrs-python/dist-pyodide

  publish-python:
    needs: [build-python, build-python-pyodide]
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true
      - name: Collect wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find wheels -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -f {} dist/ \;
          ls -la dist
          test "$(find dist -type f | wc -l)" -gt 0
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # C ABI deliverable — the sanctioned dynamic-linking artifact for external
  # C / C++ / HPC consumers: libmolrs_capi (cdylib + staticlib) plus the
  # cbindgen header, attached to the GitHub Release on v* tags. In-house Rust
  # consumers stay statically linked (see docs/interop.md, "Path C").
  build-capi:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: "", artifact: linux-x64 }
          - { os: ubuntu-24.04-arm, target: "", artifact: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, artifact: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, artifact: macos-x64 }
          - { os: windows-latest, target: "", artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-capi-${{ matrix.artifact }}
          workspaces: ". -> target"
      - name: Build libmolrs_capi (release)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --manifest-path molrs-capi/Cargo.toml --target "${{ matrix.target }}"
          else
            cargo build --release --manifest-path molrs-capi/Cargo.toml
          fi
      - name: Package (lib + header + LICENSE + sha256)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path molrs-capi/Cargo.toml \
            | jq -r '.packages[0].version')
          OUT="molrs-capi-${VERSION}-${{ matrix.artifact }}"
          if [ -n "${{ matrix.target }}" ]; then
            LIBDIR="target/${{ matrix.target }}/release"
          else
            LIBDIR="target/release"
          fi
          mkdir -p "stage/$OUT"
          cp molrs-capi/include/molrs.h LICENSE "stage/$OUT/"
          found=0
          for f in libmolrs_capi.dylib libmolrs_capi.so libmolrs_capi.a \
                   molrs_capi.dll molrs_capi.dll.lib molrs_capi.lib; do
            if [ -f "$LIBDIR/$f" ]; then cp "$LIBDIR/$f" "stage/$OUT/"; found=1; fi
          done
          test "$found" -eq 1
          tar -C stage -czf "$OUT.tar.gz" "$OUT"
          sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256"
          ls -la "$OUT.tar.gz" "$OUT.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: capi-${{ matrix.artifact }}
          path: |
            molrs-capi-*.tar.gz
            molrs-capi-*.tar.gz.sha256

  release-capi:
    needs: build-capi
    # Tag pushes only — a workflow_dispatch run exercises the build+package
    # legs above without touching any release.
    if: github.repository == 'MolCrafts/molrs' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: capi
          pattern: capi-*
          merge-multiple: true
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la capi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" capi/* --clobber
