name: Publish

# Tag push on MolCrafts/molrs master tip → crates.io + npm + PyPI.
# Manual re-run: workflow_dispatch (idempotent; skip-existing on registries).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Only the canonical repo publishes (fork tag pushes no-op via job ifs).
# Trusted publishing (OIDC) for crates.io / npm / PyPI — no long-lived tokens.

jobs:
  guard:
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on master
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag is not on master; merge release commit first."
            exit 1
          fi

  # ── crates.io ─────────────────────────────────────────────────────────────
  publish-molrs:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish molcrafts-molrs
        run: bash scripts/publish-if-new.sh molrs/Cargo.toml molcrafts-molrs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ── npm (@molcrafts/molrs) ────────────────────────────────────────────────
  publish-wasm:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-wasm
          workspaces: |
            . -> target
            molrs-wasm -> target
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build
        working-directory: molrs-wasm
        run: wasm-pack build --release --target bundler --scope molcrafts --out-name molrs
      - name: Publish
        working-directory: molrs-wasm/pkg
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "✓ $NAME@$VERSION already on npm"
          else
            npm publish --access public --provenance
          fi

  # ── PyPI (build matrix → one upload) ──────────────────────────────────────
  build-python:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --release --out dist
          - os: macos-latest
            args: --release --out dist --target universal2-apple-darwin
          - os: windows-latest
            args: --release --out dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-py-${{ matrix.os }}
          workspaces: |
            . -> target
            molrs-python -> target
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: molrs-python
          manylinux: auto
          command: build
          args: ${{ matrix.args }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: molrs-python/dist

  publish-python:
    needs: build-python
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true
      - name: Collect wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find wheels -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -f {} dist/ \;
          ls -la dist
          test "$(find dist -type f | wc -l)" -gt 0
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
