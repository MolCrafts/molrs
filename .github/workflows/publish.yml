name: Publish

# Tag on master → crates.io + npm + PyPI (desktop + Pyodide wheels).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on master
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag is not on master"
            exit 1
          fi

  publish-molrs:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish molcrafts-molrs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path molrs/Cargo.toml \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          if curl -sf "https://crates.io/api/v1/crates/molcrafts-molrs/$VERSION" >/dev/null; then
            echo "✓ molcrafts-molrs@$VERSION already on crates.io"
            exit 0
          fi
          cargo publish --manifest-path molrs/Cargo.toml

  publish-wasm:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-wasm
          workspaces: |
            . -> target
            molrs-wasm -> target
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - working-directory: molrs-wasm
        run: wasm-pack build --release --target bundler --scope molcrafts --out-name molrs
      - working-directory: molrs-wasm/pkg
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "✓ $NAME@$VERSION already on npm"
          else
            npm publish --access public --provenance
          fi

  # Desktop wheels (linux / macos / windows)
  build-python:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --release --out dist
          - os: macos-latest
            args: --release --out dist --target universal2-apple-darwin
          - os: windows-latest
            args: --release --out dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-py-${{ matrix.os }}
          workspaces: |
            . -> target
            molrs-python -> target
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: molrs-python
          manylinux: auto
          command: build
          # default features include `fs` (host filesystem zarr I/O)
          args: ${{ matrix.args }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: molrs-python/dist

  # Pyodide / Emscripten wheel for micropip (browser)
  build-python-pyodide:
    needs: guard
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Pyodide wheel
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_PLATFORM: pyodide
          # cp312-pyodide is EOL in cibuildwheel 4.x (default is 3.13/3.14).
          # Plugin loads Pyodide 0.27.x (CPython 3.12 / emscripten 3.1.58).
          CIBW_ENABLE: pyodide-eol
          CIBW_BUILD: cp312-pyodide_wasm32
          CIBW_PYODIDE_VERSION: "0.27.7"
          CIBW_TEST_SKIP: "*"
          # No host FS on Emscripten — build without default `fs` feature.
          CIBW_ENVIRONMENT_PYODIDE: MATURIN_PEP517_ARGS=--no-default-features
        with:
          package-dir: molrs-python
          output-dir: molrs-python/dist-pyodide
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: molrs-python/dist-pyodide

  publish-python:
    needs: [build-python, build-python-pyodide]
    if: github.repository == 'MolCrafts/molrs'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true
      - name: Collect wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find wheels -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -f {} dist/ \;
          ls -la dist
          test "$(find dist -type f | wc -l)" -gt 0
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
