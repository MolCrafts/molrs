name: Full

# Integration binaries under molrs/tests/ (IO, ff stages, element_architecture, …).
# Must stay in parity with the pre-push hook `cargo-test-integration` in
# `.pre-commit-config.yaml`. Runs on PRs too so master never turns red only
# after merge.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: integration binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch test data
        run: bash scripts/fetch-test-data.sh
      - name: Integration tests
        run: >
          cargo test -p molcrafts-molrs --tests --examples
          --features "full filesystem"
