name: Full

# Optional / manual only. Integration binaries under molrs/tests/ are NOT a CI
# gate and must not block PRs or master. Default CI is unit-only (`--lib`).
# Prefer converting any remaining "integration" coverage into `#[cfg(test)]`
# unit tests next to the code.
on:
  workflow_dispatch:
  schedule:
    # Keep a rare scheduled run for optional soak; never required for land.
    - cron: "0 4 * * 0"

jobs:
  integration:
    name: integration binaries (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch test data
        run: bash scripts/fetch-test-data.sh
      - name: Integration tests
        run: >
          cargo test -p molcrafts-molrs --tests --examples
          --features "full filesystem"
