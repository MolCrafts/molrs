name: CI

# Default gate: unit tests + lint + binder smoke builds.
# Jobs are independent. Caches via Swatinem/rust-cache + uv (see called workflows).
# No integration-binary suite. Unit tests only + binder smoke.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/ci-rust.yml

  wasm:
    name: WASM
    uses: ./.github/workflows/ci-wasm.yml

  python:
    name: Python
    uses: ./.github/workflows/ci-python.yml

  capi:
    name: C API
    uses: ./.github/workflows/ci-capi.yml
