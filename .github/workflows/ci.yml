name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/ci-rust.yml

  wasm:
    name: WASM
    uses: ./.github/workflows/ci-wasm.yml

  python:
    name: Python
    uses: ./.github/workflows/ci-python.yml

  capi:
    name: C API
    uses: ./.github/workflows/ci-capi.yml

  snapshot:
    name: Snapshot
    uses: ./.github/workflows/ci-snapshot.yml
    # A called workflow gets no secrets unless they are handed over, and this
    # one needs the MolCrafts App key to publish.
    secrets: inherit
