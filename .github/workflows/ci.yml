name: CI

# Default gate: unit tests + lint + binder smoke builds.
# No job waits on another. No caches. No bench.
# Integration binaries: full.yml (PR + master). Local parity: pre-push hooks.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/ci-rust.yml

  wasm:
    name: WASM
    uses: ./.github/workflows/ci-wasm.yml

  python:
    name: Python
    uses: ./.github/workflows/ci-python.yml

  capi:
    name: C API
    uses: ./.github/workflows/ci-capi.yml
