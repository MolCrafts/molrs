name: test

# Every test gate of scripts/check.sh, in two tiers (`test / context` decides):
#
#   fast  a feature-branch push to MolCrafts: core Rust tests and the Python
#         suite on Linux.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches:
#         + ffi/cxx/ext/package, the OS
#         matrix, the feature matrix, C API, WASM and molrec's conformance
#         suite (mrec).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      cancel: ${{ steps.context.outputs.cancel }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  rust:
    name: test / rust
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: rust
      - run: scripts/check.sh test ${{ needs.context.outputs.tier == 'full' && 'ffi cxx ext package' || '' }}

  # abi3-py312: one native artifact per OS, so one Python per OS.
  python:
    name: test / python (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: python
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: scripts/check.sh python

  features:
    name: test / features
    needs: context
    if: needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: features
      - run: scripts/check.sh features

  capi:
    name: test / capi
    needs: context
    if: needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: capi
      - run: scripts/check.sh capi

  wasm:
    name: test / wasm
    needs: context
    if: needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: wasm
      - uses: ./.github/actions/setup-wasm
      - run: scripts/check.sh wasm

  # molrec's conformance suite through molrs.io's *.mrec doors, molrec at the
  # commit scripts/partners.py resolves (molrec's dev, or its branch named
  # like this one).
  mrec:
    name: test / mrec
    needs: context
    if: needs.context.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@master
        with:
          cache: mrec
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: scripts/check.sh mrec
