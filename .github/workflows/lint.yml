name: lint

# Format, linters and static checks: every scripts/check.sh gate that runs
# no test. Same jobs in every context (feature branch or dev/master, fork or
# upstream); see "CI" in molrs-python/docs/contributing.md.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

jobs:
  # The commit-stage hooks (hygiene, fmt, ruff, os-cfg) on every file, and the
  # partners check. Nothing compiles.
  hooks:
    name: lint / hooks
    # A pull request inside a fork was already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-python
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - run: scripts/check.sh partners

  clippy:
    name: lint / clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache: lint
      - run: scripts/check.sh clippy doc
