name: CI Rust

on:
  workflow_call:
  workflow_dispatch:

# Every job installs the toolchain rust-toolchain.toml pins and runs
# scripts/check.sh, the same gates prek runs locally.

jobs:
  lint:
    name: fmt + partners + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          workspaces: ". -> target"
      - run: scripts/check.sh fmt partners clippy doc

  test:
    name: unit + ffi + cxx + ext + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: ". -> target"
      - run: scripts/check.sh test ffi cxx ext package

  features:
    name: Feature isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          workspaces: ". -> target"
      - run: scripts/check.sh features
