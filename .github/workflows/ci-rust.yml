name: CI Rust

on:
  workflow_call:
  workflow_dispatch:

# Toolchain comes from rust-toolchain.toml (currently 1.96.0). Do not use
# dtolnay/rust-toolchain@stable — that floats past the pin and fails clippy
# on lints the local prek hook never saw.

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          workspaces: ". -> target"
      - run: cargo fmt --check
      - run: |
          cargo clippy -p molcrafts-molrs --all-targets --features full,filesystem -- -D warnings
          cargo clippy --manifest-path molrs-cxxapi/Cargo.toml --all-targets -- -D warnings

  test:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: ". -> target"
      - run: bash scripts/fetch-test-data.sh
      - run: cargo test -p molcrafts-molrs --lib --features full,filesystem
      # --lib does not run rustdoc examples; a renamed public item otherwise
      # goes unnoticed until a human opens docs.rs.
      - run: cargo test --doc -p molcrafts-molrs --features full,filesystem
      # molrs-ffi is a standalone workspace root, so the lines above never
      # cover it. Its suite carries the ABI layout-snapshot gate (minor-line
      # layout freeze) — it must run on every push.
      - run: cargo test --manifest-path molrs-ffi/Cargo.toml
