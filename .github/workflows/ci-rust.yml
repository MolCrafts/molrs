name: CI Rust

on:
  workflow_call:
  workflow_dispatch:

# Three independent jobs — never serialise fmt → clippy → test.
# Unit suite is `--lib` only. No integration-binary suite in CI.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          workspaces: ". -> target"
      - run: |
          cargo clippy -p molcrafts-molrs --all-targets --features full -- -D warnings
          cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings

  test:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: ". -> target"
      # IO fixtures (LAMMPS data, chemfiles corpus, …) live in MolCrafts/tests-data.
      # Must land before --lib tests that resolve ../tests-data/<format>/.
      - name: Fetch tests-data
        run: bash scripts/fetch-test-data.sh
      - name: Unit tests
        run: cargo test -p molcrafts-molrs --lib --features full
