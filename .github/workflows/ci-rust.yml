name: CI Rust

on:
  workflow_call:
  workflow_dispatch:

# Three independent jobs — never serialise fmt → clippy → test.
# Unit suite is `--lib` only. No integration-binary suite in CI.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # One invocation: facade with every sub-system feature, plus workspace
      # members (cxxapi). No second full-tree pass.
      - run: |
          cargo clippy -p molcrafts-molrs --all-targets --features full -- -D warnings
          cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings

  test:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Function-level unit tests only. No tests-data, no integration binaries,
      # no bench compile, no second feature matrix.
      - name: Unit tests
        run: cargo test -p molcrafts-molrs --lib --features full
