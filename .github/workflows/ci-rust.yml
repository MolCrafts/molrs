name: CI Rust

on:
  workflow_call:
  workflow_dispatch:

# CI/publish pin today's static, LTO'd form; the local default is dynamic via
# .cargo/config.toml (env RUSTFLAGS replaces those rustflags entirely).
env:
  RUSTFLAGS: "-C prefer-dynamic=no"
  CARGO_PROFILE_RELEASE_LTO: "thin"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          workspaces: ". -> target"
      - run: |
          cargo clippy -p molcrafts-molrs --all-targets --features full,filesystem -- -D warnings
          cargo clippy --manifest-path molrs-cxxapi/Cargo.toml --all-targets -- -D warnings

  test:
    name: unit
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: ". -> target"
      - run: bash scripts/fetch-test-data.sh
      - run: cargo test -p molcrafts-molrs --lib --features full,filesystem
      # molrs-ffi is a standalone workspace root, so the line above never
      # covers it. Its suite carries the ABI layout-snapshot gate (minor-line
      # layout freeze) — it must run on every push. No `--features ff`: `ff` is
      # a default feature now, so passing it explicitly is redundant.
      - run: cargo test --manifest-path molrs-ffi/Cargo.toml
