name: CI Rust

on:
  workflow_call:
  workflow_dispatch:

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          workspaces: ". -> target"
      - run: |
          cargo clippy -p molcrafts-molrs --all-targets --features full,filesystem -- -D warnings
          cargo clippy -p molcrafts-molrs-cxxapi --all-targets -- -D warnings

  test:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: ". -> target"
      - run: bash scripts/fetch-test-data.sh
      - run: cargo test -p molcrafts-molrs --lib --features full,filesystem
