name: CI Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # abi3 — share one cache per OS across Python minors
          shared-key: python-maturin-${{ matrix.os }}
          workspaces: |
            . -> target
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            molrs-python/pyproject.toml
            molrs-python/Cargo.toml
      # Tools only (no project install) → tox builds the wheel once.
      # Same gate as prek pre-push.
      - name: tox -e py
        working-directory: molrs-python
        shell: bash
        run: |
          set -euo pipefail
          uv sync --no-install-project --extra dev
          uv run --no-sync tox -e py
