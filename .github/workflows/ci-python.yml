name: CI Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Same entry as prek pre-push: tox -c molrs-python -e py
      # (isolated env, maturin wheel, non-editable install, pytest).
      - name: tox -c molrs-python -e py
        run: |
          uv tool install tox
          tox -c molrs-python -e py
