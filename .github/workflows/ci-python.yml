name: CI Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-maturin
          workspaces: |
            . -> target
            molrs-python -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            molrs-python/pyproject.toml
            molrs-python/uv.lock
            molrs-python/Cargo.toml
            molrs-python/Cargo.lock

      # Same entry as prek pre-push (tox from molrs-python[dev]).
      - name: uv run --extra dev tox -e py
        working-directory: molrs-python
        run: uv run --extra dev tox -e py
