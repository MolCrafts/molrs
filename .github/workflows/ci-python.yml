name: CI Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-maturin-${{ matrix.os }}-py${{ matrix.python-version }}
          workspaces: |
            . -> target
            molrs-python -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            molrs-python/pyproject.toml
            molrs-python/Cargo.toml

      # Same entry as prek pre-push (tox from molrs-python[dev]).
      # tox base_python follows the runner interpreter (matrix.python-version).
      - name: uv run --extra dev tox -e py
        working-directory: molrs-python
        run: uv run --extra dev tox -e py
