name: CI Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # abi3-py312: one native artifact per OS. 3.13/3.14 do not rebuild the
        # extension and were a 3× maturin tax with no extra coverage.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-maturin-${{ matrix.os }}
          workspaces: ". -> target"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            molrs-python/pyproject.toml
            molrs-python/Cargo.toml
      - run: scripts/check.sh python
        shell: bash

  # The docs site Cloudflare Pages deploys, built the way it builds it (a
  # fresh `pip install ".[doc]"`, then zensical) with --strict: an unresolved
  # mkdocstrings reference or any other warning fails. Same gate as pre-push.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-docs
          workspaces: ". -> target"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/check.sh docs
