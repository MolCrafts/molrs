name: CI C API

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # The committed .cargo/config.toml routes this build into <repo>/target.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: capi
          workspaces: ". -> target"
      - run: scripts/check.sh capi
