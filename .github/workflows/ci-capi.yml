name: CI C API

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      # The committed .cargo/config.toml routes this build into <repo>/target,
      # which is what this entry caches (it previously cached a dir the build
      # never wrote to — molrs-capi/target was the real location).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: capi
          workspaces: ". -> target"

      - name: Build molrs-capi (generates header via cbindgen)
        run: cargo build --manifest-path molrs-capi/Cargo.toml

      - name: Configure C++ integration tests
        working-directory: molrs-capi
        run: cmake -S tests/cpp -B build-test

      - name: Build C++ integration tests
        working-directory: molrs-capi
        run: cmake --build build-test

      - name: Run C++ integration tests
        working-directory: molrs-capi
        run: ctest --test-dir build-test --output-on-failure
