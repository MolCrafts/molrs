name: CI WASM

# Nothing to configure: a zero-argument build already IS the static release
# form, on wasm32 as everywhere else (see docs/interop.md).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Single entry: the committed .cargo/config.toml routes molrs-wasm's
      # build into <repo>/target too.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Binary install — never `cargo install wasm-pack` (cold compile ~1–2 min).
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # apt binaryen is too old for current rustc wasm (misc opcode 17).
      # Latest GitHub release — same policy as rust-toolchain.toml `stable`.
      - name: Install binaryen (wasm-opt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(gh api repos/WebAssembly/binaryen/releases/latest --jq .tag_name)
          case "$(uname -m)" in
            x86_64) BIN=x86_64-linux ;;
            aarch64|arm64) BIN=aarch64-linux ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-${BIN}.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-opt --version

      - name: Build wasm
        working-directory: molrs-wasm
        run: wasm-pack build --release --target bundler --scope molcrafts --out-name molrs

      # The suite runs under Node — nothing configures `run_in_browser`, so no
      # headless browser or webdriver is needed. It was absent until two
      # `core::block` tests had been failing unnoticed: building the wasm
      # proves it compiles, not that it works.
      - name: Test wasm
        working-directory: molrs-wasm
        run: wasm-pack test --node
