name: CI WASM

# Nothing to configure: a zero-argument build already IS the static release
# form, on wasm32 as everywhere else (see docs/interop.md).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml carries the wasm32-unknown-unknown target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: ". -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Binary install — never `cargo install wasm-pack` (cold compile ~1–2 min).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # apt binaryen is too old for current rustc wasm (misc opcode 17). The
      # version is the one scripts/check.sh pins.
      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^BINARYEN_VERSION=//p' scripts/check.sh)
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-opt --version
      - run: scripts/check.sh wasm
