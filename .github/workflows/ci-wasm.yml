name: CI WASM

# Nothing to configure: a zero-argument build already IS the static release
# form, on wasm32 as everywhere else (see docs/interop.md).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      # Single entry: the committed .cargo/config.toml routes molrs-wasm's
      # build into <repo>/target too.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Binary install — never `cargo install wasm-pack` (cold compile ~1–2 min).
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # molrs-wasm release profile runs wasm-opt -O1 (see Cargo.toml metadata).
      # apt binaryen is too old for current rustc wasm (misc opcode 17); pin a
      # GitHub release that understands LLVM 19+ output (matches local brew).
      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          VER=version_123
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-opt --version

      - name: Build wasm
        working-directory: molrs-wasm
        run: wasm-pack build --release --target bundler --scope molcrafts --out-name molrs

      # The suite runs under Node — nothing configures `run_in_browser`, so no
      # headless browser or webdriver is needed. It was absent until two
      # `core::block` tests had been failing unnoticed: building the wasm
      # proves it compiles, not that it works.
      - name: Test wasm
        working-directory: molrs-wasm
        run: wasm-pack test --node
