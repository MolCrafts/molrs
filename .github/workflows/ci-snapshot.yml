name: CI Snapshot

# Measures one run of the Rust core and publishes three records to the
# MolCrafts CI index, whose push rebuilds the engineering dashboard:
#
#   tests         cargo test --lib, the same invocation as cargo mrs-test
#   coverage      rustc -C instrument-coverage, then the toolchain's llvm-cov
#   conformance   molrec's standard suite, through molrs.io.mrec
#
# Rust core only. molrs-python's pytest suite, and the ffi / C / CXX / WASM
# crates, are not measured here. Doctests stay in ci-rust.yml (`cargo mrs-doctest`).
#
# Separate from ci-rust.yml on purpose. That workflow is the release gate
# for the unit tests. This one reports, and it also runs the mrec suite,
# which the gate does not. A red unit-test run still publishes its tests
# record. A red mrec suite fails this job after the record is written.

#
# Two jobs, so no third-party code shares a job with a secret. `measure` builds
# molrec and runs its suite with a read-only token and no secrets; `publish`
# holds MOLCRAFTS_CI_SSH_KEY and only submits the three named records that
# `measure` uploaded.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Measure tests + coverage + mrec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The suite and its molrs adapter live in molrec, not in this repo.
      # Pinned to a molrec commit: a floating ref would run whatever lands
      # there. Bump deliberately when molrec's adapter moves.
      - uses: actions/checkout@v7
        with:
          repository: MolCrafts/molrec
          ref: 1fc2e262e4b72fa92f44b5bca711c8876866415d
          path: .ci-out/molrec
          persist-credentials: false

      # Pinned by rust-toolchain.toml. llvm-tools ships llvm-profdata and
      # llvm-cov next to rustc. They are not on PATH; the measure step calls
      # them by their sysroot path.
      - run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: snapshot
          workspaces: ". -> target"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same cargo test as `cargo mrs-test`, with rustc's coverage
      # instrumentation. The toolchain's llvm-profdata merges the raw
      # profiles and llvm-cov exports LCOV. A red suite still leaves a
      # `test result:` line and a tracefile. A compile failure does not,
      # and fails this step.
      - name: Measure the Rust core
        id: measure
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .ci-out/profraw
          sysroot=$(rustc --print sysroot)
          host=$(rustc -vV | awk '/^host: / { print $2 }')
          llvm=$sysroot/lib/rustlib/$host/bin
          export RUSTFLAGS="-C instrument-coverage"
          export LLVM_PROFILE_FILE="$PWD/.ci-out/profraw/molrs-%p-%m.profraw"
          export CARGO_TERM_COLOR=never

          set +e
          cargo test -p molcrafts-molrs --lib --features full,filesystem,stream \
            -- --color=never | tee .ci-out/cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if ! grep -q '^test result:' .ci-out/cargo-test.log; then
            exit "$status"
          fi

          exe=$(cargo test -p molcrafts-molrs --lib --features full,filesystem,stream \
            --no-run --message-format=json | python3 -c '
          import json, sys
          found = None
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  msg = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if msg.get("reason") != "compiler-artifact" or not msg.get("executable"):
                  continue
              if (msg.get("profile") or {}).get("test"):
                  found = msg["executable"]
          if not found:
              raise SystemExit("no instrumented test executable")
          print(found)
          ')
          "$llvm/llvm-profdata" merge -sparse .ci-out/profraw/*.profraw -o .ci-out/coverage.profdata
          "$llvm/llvm-cov" export \
            -format=lcov \
            -instr-profile=.ci-out/coverage.profdata \
            -ignore-filename-regex='/\.cargo/registry/' \
            -ignore-filename-regex='/rustlib/' \
            "$exe" > .ci-out/lcov.info

      # molci and maturin. maturin is the build backend molrs-python already
      # declares; the suite calls the Rust core through molrs.io.mrec.
      - name: Python tools
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m venv .ci-out/venv
          # shellcheck disable=SC1091
          source .ci-out/venv/bin/activate
          python -m pip install \
            maturin \
            "./.ci-out/molrec" \
            "molcrafts-ci @ git+https://github.com/MolCrafts/molcrafts-ci@master"

      # `--track` marks master pushes. Whether the records are actually pushed
      # is decided by the publish job, which alone sees MOLCRAFTS_CI_SSH_KEY.
      - name: Build test and coverage snapshots
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && hashFiles('.ci-out/cargo-test.log') != '' }}
        run: |
          set -euo pipefail
          args=(
            --out .ci-out/snapshots
            --cargo-test .ci-out/cargo-test.log
            --coverage-producer llvm-cov
          )
          if [[ -f .ci-out/lcov.info ]]; then
            args+=(--coverage .ci-out/lcov.info --coverage-format lcov)
          fi
          # shellcheck disable=SC1091
          source .ci-out/venv/bin/activate
          molci snapshot \
            "${args[@]}" \
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && '--track' || '' }}

      # molrs.io.mrec is the Rust core's path door. Building the extension
      # is how the suite reaches that door. The Python test suite is not run.
      # A red suite fails this job; its record is still written and published.
      - name: Run the mrec suite
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .ci-out/venv/bin/activate
          maturin develop --manifest-path molrs-python/Cargo.toml
          python scripts/ci-conformance.py \
            --suite .ci-out/molrec/tests \
            --out .ci-out/snapshots/conformance.json \
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && '--track' || '' }}

      # Only the three records molci writes, by name: nothing else a step may
      # have dropped into .ci-out/snapshots reaches the publish job.
      - name: Upload snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-snapshots
          if-no-files-found: ignore
          path: |
            .ci-out/snapshots/tests.json
            .ci-out/snapshots/coverage.json
            .ci-out/snapshots/conformance.json

  publish:
    name: Publish to molcrafts-ci
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-snapshots
          path: snapshots
        continue-on-error: true
      - name: Publish to molcrafts-ci
        if: ${{ hashFiles('snapshots/*.json') != '' }}
        uses: MolCrafts/molcrafts-ci/actions/submit@master
        with:
          snapshot-path: snapshots/*.json
          project: molrs
          # A deploy key on molcrafts-ci: one repository, git only.
          ssh-key: ${{ secrets.MOLCRAFTS_CI_SSH_KEY }}
