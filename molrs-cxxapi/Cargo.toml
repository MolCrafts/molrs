[package]
name = "molcrafts-molrs-cxxapi"
# Literal, not `.workspace = true`: this crate left the root workspace (see
# [workspace] below), so there is no workspace.package to inherit from. Keep
# these in step with ../Cargo.toml's [workspace.package] by hand — same rule the
# other standalone binder roots already live by.
version = "0.14.0"
edition = "2024"
rust-version = "1.91"
authors = ["MolCrafts"]
license = "BSD-3-Clause"
description = "CXX bridge for Atomiverse C++ integration"
repository = "https://github.com/MolCrafts/molrs"
homepage = "https://github.com/MolCrafts/molrs"

[lib]
name = "molrs_cxxapi"
crate-type = ["staticlib", "rlib"]

# Standalone workspace root, like every other binder crate. Being a MEMBER of
# the root workspace was a unit-identity defect (axis 4 in
# .claude/specs/ffi-shared-dylib.md): a member builds molrs under a different
# unit flavour than a path dependency does, and because this crate depends on
# molrs-ffi it wrote that flavour into the hashless
# target/debug/deps/libmolrs_ffi.dylib, overwriting the copy the other roots
# link. Lint/build it with `--manifest-path molrs-cxxapi/Cargo.toml`.
[workspace]

# Standalone workspace root: does NOT inherit the repo root's [profile.release].
# Keep in sync with ../Cargo.toml so this staticlib gets the same optimization.
#
# No LTO here — it is incompatible with the shared dylib graph: once a Rust
# dylib (libmolrs_ffi) is in a cdylib's dependency graph, rustc refuses with
# "only 'staticlib', 'bin', and 'cdylib' outputs are supported with LTO"
# (probe C2 in .claude/specs/ffi-shared-dylib.md). CI/publish restore it on
# their static path via env CARGO_PROFILE_RELEASE_LTO=thin.
[profile.release]
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
default = ["zarr"]
zarr = ["molrs/filesystem"]

[dependencies]
# The merged crate, imported under the extern name `molrs`, on its default
# feature union (the shared-dylib precondition). The explicit io/compute/ff list
# is additive and idempotent with the union — it records what this bridge relies
# on regardless of what `default` happens to carry.
molrs = { path = "../molrs", package = "molcrafts-molrs", version = "0.14.0", features = ["io", "compute", "ff"] }
molrs-ffi = { path = "../molrs-ffi", package = "molcrafts-molrs-ffi", version = "0.14.0" }
cxx = "1"
ndarray = "0.17"

[build-dependencies]
cxx-build = "1"
# Compiles the C++ translation unit the integration tests call the bridge from
# (tests/cxx/bridge_probe.cc). Test support only — `src/` builds nothing with it.
cc = "1"
