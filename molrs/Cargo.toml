[package]
name = "molcrafts-molrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Molecular simulation toolkit: core data structures, IO, trajectory analysis, force fields, SMILES, and 3D conformer generation (feature-gated modules)"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["molecular-modeling", "chemistry", "simulation", "molecular-dynamics"]
categories = ["science"]
# No integration-test, bench or example targets: behaviour is tested in
# `#[cfg(test)]` modules next to the code (`cargo test --lib`).
autotests = false
autobenches = false
autoexamples = false

# docs.rs builds the public API with every sub-system enabled.
[package.metadata.docs.rs]
features = ["full"]

[lib]
name = "molrs"

[dev-dependencies]
tempfile = "3.0"

[features]
# Native default: every sub-system plus filesystem-backed zarr and rayon.
# `stream` (tokio + WebSocket) is opt-in — molrs-python turns it on itself.
# wasm / Pyodide opt down with `default-features = false`.
default = ["full", "filesystem", "rayon"]
# Full bundle (every sub-system).
full = ["io", "compute", "smiles", "ff", "conformer", "signal", "voronoi", "md"]

# Sub-system modules (each gates its module + its unique optional deps).
io        = ["dep:flate2"]
# `smiles` lives inside the `io` module.
smiles    = ["io"]
signal    = ["dep:rustfft"]
# `compute` depends on the `signal` module (gets rustfft via it).
compute   = ["signal"]
# Radical (Laguerre) Voronoi tessellation + domain/void analysis. Native
# pure-Rust (WASM-clean); lives in the `compute` module.
voronoi   = ["compute"]
ff        = ["dep:rustfft", "dep:roxmltree"]
# `conformer` depends on the `ff` module.
conformer = ["ff"]
# In-process MD (integrators, shifted LJ). Science only; pair search is
# core NeighborList. Python composer / hooks live in molrs-python. Consumes
# the one `ff::potential::Potential`/`Potentials` seam, so it enables `ff`.
md        = ["ff"]
# serde `Serialize`/`Deserialize` for the core model (Frame/Block/Column/SimBox).
# No new deps — serde is already always-on; the feature just enables the impls.
serde     = []
# Live Frame streaming — MolRec-aligned MessagePack/JSON encoding, plus native
# WebSocket transport. On WASM only the wire codec is compiled. Not in `full`.
stream    = ["serde", "dep:rmp-serde", "dep:tokio", "dep:tokio-tungstenite", "dep:crossbeam-channel", "dep:futures-util", "dep:bytes"]

# Core knobs.
rayon      = ["dep:rayon"]
# Codecs are contract surface, not a nicety. Every other Zarr implementation
# compresses by default -- zarr-python writes zstd -- so a build without them
# cannot read the ecosystem it belongs to, whatever the layout says. Two
# tiers, because the C-backed ones cannot cross-compile to wasm32:
#
#   zarr         base + the pure-Rust codecs. Everywhere, wasm included.
#   zarr-codecs  adds zstd and blosc, which bind C. Native only.
#
# `sharding` is in the base tier deliberately: molrec bounds a store's file
# count with it, and a reader that cannot open a shard cannot open the store.
zarr       = ["dep:zarrs", "zarrs/gzip", "zarrs/crc32c", "zarrs/sharding", "zarrs/transpose"]
zarr-codecs = ["zarr", "zarrs/zstd", "zarrs/blosc"]
filesystem = ["zarr", "zarr-codecs", "zarrs/filesystem", "dep:zip", "dep:zarrs_zip"]

[dependencies]
# Always-on (core foundation).
ndarray    = "0.17"
slotmap    = "1"
smallvec   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# `lgamma` (Wigner / spherical harmonics) and `erf`/`erfc` (PME) — none of
# them is in Rust's std on any target.
libm       = "0.2"
# Storage-width scalars for columns. Distinct from [`F`]/[`I`]/[`Idx`]: those
# are domain aliases (compute scalar, small integer, identifier). A column
# that arrived as f32 or i64 has to leave as the same width.
half        = { version = "2", default-features = false, features = ["num-traits", "std"] }
num-complex = "0.4"
# Seeded RNG for structure builders (`builder` SARW) and for
# compute/conformer stochastic paths. Always-on so `builder` is always compiled.
rand       = "0.10"

# Feature-gated optional deps — a build with a sub-system OFF does not compile
# that sub-system's unique dependency.
rayon          = { version = "1.12", optional = true }                                              # core/ff/compute parallelism (default)
zarrs          = { version = "0.23", optional = true, default-features = false, features = ["ndarray"] }  # zarr trajectories (core+io)
flate2         = { version = "1.1", optional = true, features = ["rust_backend"] }                  # io (compressed formats)
rustfft        = { version = "6", optional = true }                                                 # signal + ff + compute
roxmltree      = { version = "0.21", optional = true }                                              # ff (XML force-field readers)
rmp-serde      = { version = "1", optional = true }                                                 # stream (MessagePack wire encoding)
# `io/zarr/pack.rs` and nothing else: `zip` writes the `.zarr.zip` a closed
# directory store packs into, `zarrs_zip` reads it back. Both hang on
# `filesystem`, so a build without that feature compiles neither — which is
# what keeps them out of the wasm graph. `zip` is built with default-features
# off: only method 0 (Stored) is ever written, so none of its compression
# backends (bzip2/lzma/zstd/aes) are compiled.
zip            = { version = "6", optional = true, default-features = false }                       # filesystem (pack.rs)
zarrs_zip      = { version = "0.5", optional = true }                                               # filesystem (pack.rs)

# WebSocket streaming is native-only. On wasm32, `--no-default-features
# --features stream` builds the wire codec without pulling tokio/tungstenite.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio              = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite  = { version = "0.26", optional = true }
crossbeam-channel  = { version = "0.5", optional = true }
futures-util       = { version = "0.3", optional = true, default-features = false, features = ["sink"] }
bytes              = { version = "1", optional = true }

# wasm32 has no OS RNG: `rand`'s transitive `getrandom` needs the `wasm_js`
# backend to build for the browser target. Target-gated so native builds are
# unaffected. Mirrors molrs-wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
